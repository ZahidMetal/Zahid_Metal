<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zahid Metal</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #222;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
    }

    .hero {
      text-align: center;
      padding: 50px 20px;
      background: white;
    }

    .hero h2 {
      font-size: 32px;
    }

    .products {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 30px;
    }

    .product {
      background: white;
      width: 250px;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
    }

    .product h3 {
      margin-top: 0;
    }

    button {
      background: #222;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #444;
    }

    footer {
      background: #222;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Zahid Metal</h1>
    <p>Quality Metal Products</p>
  </header>

  <section class="hero">
    <h2>Welcome to Zahid Metal 🛍️</h2>
    <p>Choose your product and place your order easily.</p>
  </section>

  <section class="products">

    <div class="product">
      <h3>Metal Product 1</h3>
      <p>Price: Contact Us</p>
      <button onclick="order()">Order Now</button>
    </div>

    <div class="product">
      <h3>Metal Product 2</h3>
      <p>Price: Contact Us</p>
      <button onclick="order()">Order Now</button>
    </div>

    <div class="product">
      <h3>Metal Product 3</h3>
      <p>Price: Contact Us</p>
      <button onclick="order()">Order Now</button>
    </div>

  </section>

  <footer>
    <p>© 2026 Zahid Metal. All Rights Reserved.</p>
  </footer>

  <script>
    function order() {
      alert(
        "✅ Order received!\\n\\n" +
        "We will call you to confirm the order, total price, delivery charge, " +
        "delivery date and estimated delivery time."
      );
    }
  </script>

</body>
</html>
